name: CI/CD

# - Pull request / push: chạy toàn bộ test (unit + Worker/D1 + e2e) và build thử.
# - Push lên main (test đã qua): áp dụng migration D1 rồi deploy lên Cloudflare Workers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Hủy lần chạy cũ của cùng PR khi có commit mới; riêng main thì không hủy giữa chừng khi đang deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (unit + Worker/D1 + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Unit test + test Worker/D1 (Vitest)
        run: npm test

      - name: Build thử Worker (không cần tài khoản Cloudflare)
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Cài trình duyệt cho e2e
        run: npx playwright install --with-deps chromium

      - name: E2E test (Playwright + wrangler dev + D1 cục bộ)
        run: npm run test:e2e

      - name: Lưu báo cáo e2e khi lỗi
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy lên Cloudflare Workers
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Tạo Environment "production" trong Settings > Environments nếu muốn bắt buộc duyệt trước khi deploy.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Kiểm tra cấu hình trước khi deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN hoặc CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if grep -q "REPLACE_WITH_YOUR_D1_DATABASE_ID" wrangler.jsonc; then
            echo "::error::Chưa điền database_id của D1 trong wrangler.jsonc (chạy: npx wrangler d1 create mario-game-db)."
            exit 1
          fi

      - name: Áp dụng migration D1 (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test sau deploy
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Đã deploy: $URL"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/api/health" && curl -fsS "$URL/api/scores" > /dev/null && curl -fsS "$URL/" | grep -q "Mario"; then
              echo "Smoke test OK"; exit 0
            fi
            echo "Thử lại lần $i..."; sleep 5
          done
          echo "::error::Smoke test thất bại"; exit 1
